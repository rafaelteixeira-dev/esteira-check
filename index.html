<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front-Font2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <div class="container">
            <span class="logo-texto">SmartPicking</span>
        </div>
        <a href="dashboard.html" class="nav-btn" style="text-decoration: none;">👤 Painel do Supervisor</a>
    </header>

    <main class="main-container">
        <h1 class="title">Identificação do Operador</h1>
        <p class="subtitle">Informe seus dados para iniciar a confercência de peças</p>

        <form id="loginForm" class="form-card" action="barras.html" method="get">

            <div class="input-group">
                <label for="operadorName" class="input-label">Nome do Operador</label>
                <div class="select">
                    <select id="operadorName" required>
                        <option value="" disabled selected hidden>Selecione seu nome</option>
                        <option value="lucas">Lucas Santos</option>
                        <option value="ryan">Ryan Nicolas</option>
                        <option value="levi">Levi</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label>Senha</label>
                <input type="password" id="senha-input" placeholder="Digite sua senha">
                <p class="subtitle">Lucas Satnos e Rafael Teixeira já vem cadastrados coma senha "1234"</p>
            </div>
            <div class="acoes">
                <label for="workShift" class="input-label">TURNO / LOTE DE TRABALHO</label>
                <input type="text" id="workShift" placeholder="Digite o número do turno ou lote" required>
            </div>

            <button type="submit" class="btn-submit">INICIAR TURNO</button>

            
            <div>
                <button type="button" id="open-cadastro" class="btn-cadastro">+Cadastrar novo operador</button>
            </div>

        </form>
    </main>
    <script src="index.js"></script>
</body>

</html>
